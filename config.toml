[paths]
sdac = "data/raw/sdac_results.csv"
forecasts = "data/raw/system_forecasts.csv"
weather = "data/raw/weather.csv"
gopacs = "data/raw/gopacs_events.csv"
postcodes = "data/raw/geonames/postcodes.zip"
places = "data/raw/geonames/places.zip"
csc_report = "data/raw/CSC_public_report_2026-10-01-0925.xlsx"
manual_locations = "reference/manual_locations.csv"
excluded_requests = "reference/excluded_requests.csv"
locations = "data/processed/area_locations.csv"
model_dir = "models"
predictions = "outputs/predictions.csv"
area_predictions = "outputs/area_predictions.csv"
validation = "outputs/validation_history.csv"

[grid]
cell_degrees = 0.25
start_date = "2024-04-01"
directions = ["feed-in", "offtake"]

[features]
history_days = 7
long_history_days = 28
price_lag_days = 1
issue_hour = 14
active_days = 90

[labels]
settle_days = 1

[model]
test_days = 3
day_threshold = 0.2
learning_rate = 0.03
max_iter = 300
max_leaf_nodes = 31
min_samples_leaf = 4000
l2_regularization = 5.0
random_state = 42

[validation]
window_days = 14
min_skill = 0.0
