[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "congestion_nl"
version = "0.2.0"
description = "Next-day Dutch grid congestion risk per GOPACS area, validated against GOPACS events"
requires-python = ">=3.11"
dependencies = [
    "pandas>=2.2",
    "numpy>=1.26",
    "scikit-learn>=1.4",
    "joblib>=1.3",
]

[project.optional-dependencies]
test = ["pytest>=8"]
entsoe = ["entsoe-py>=0.8"]

[project.scripts]
congestion-nl = "congestion_nl.cli:main"

[tool.setuptools]
packages = ["congestion_nl"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["."]
